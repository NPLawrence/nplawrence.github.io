name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages deployment via Actions.
# In your repo Settings → Pages, set Source to "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cv/requirements.txt

      - name: Install Python deps
        run: pip install -r cv/requirements.txt

      - name: Generate publications data (_data/publications.yaml from BibTeX)
        run: python scripts/bib2csl.py

      - name: Generate CV LaTeX
        run: |
          mkdir -p cv/build
          cd cv && python generate.py cv.yaml -l

      - name: Compile CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv/build
          args: -pdf -interaction=nonstopmode -file-line-error

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Add CV PDF to site output
        run: mkdir -p _site/assets && cp cv/build/cv.pdf _site/assets/lawrence_cv.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
